spring.application.name=stockflow

# Datasource: SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME y SPRING_DATASOURCE_PASSWORD
# se enlazan desde el entorno (sin valores por defecto ni credenciales versionadas).

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# Sin UserDetailsService por defecto: evita el usuario/clave generados por Spring Boot.
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration

# Lista separada por comas, definida por STOCKFLOW_CORS_ALLOWED_ORIGINS (sin valor por defecto).
stockflow.cors.allowed-origins=${STOCKFLOW_CORS_ALLOWED_ORIGINS}

# Registro y activación (todas obligatorias, sin valores por defecto).
stockflow.activation.public-url=${STOCKFLOW_PUBLIC_ACTIVATION_URL}
stockflow.activation.token-ttl=${STOCKFLOW_ACTIVATION_TOKEN_TTL}

# Cifrado AES-256-GCM del outbox: clave Base64 de 32 bytes y key id. Si son inválidos la app no arranca.
stockflow.outbox.encryption-key=${STOCKFLOW_OUTBOX_ENCRYPTION_KEY}
stockflow.outbox.encryption-key-id=${STOCKFLOW_OUTBOX_ENCRYPTION_KEY_ID}

# SMTP: solo lo usa el worker (stockflow.worker.enabled=true); la API arranca sin SMTP.
stockflow.smtp.host=${STOCKFLOW_SMTP_HOST:}
stockflow.smtp.port=${STOCKFLOW_SMTP_PORT:}
stockflow.smtp.username=${STOCKFLOW_SMTP_USERNAME:}
stockflow.smtp.password=${STOCKFLOW_SMTP_PASSWORD:}
stockflow.smtp.from=${STOCKFLOW_SMTP_FROM:}
stockflow.worker.enabled=false
