services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB must be set in .env}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20

  smtp:
    image: axllent/mailpit:v1.33.1
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    image: ${STOCKFLOW_APP_IMAGE:-stockflow-app:local}
    env_file: ${STOCKFLOW_ENV_FILE:-.env}
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:?POSTGRES_DB must be set in .env}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:?POSTGRES_USER must be set in .env}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      STOCKFLOW_DOCUMENTS_STORAGE_PATH: /var/lib/stockflow/documents
      STOCKFLOW_WORKER_ENABLED: "false"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${STOCKFLOW_APP_PORT:-8080}:8080"
    volumes:
      - documents-data:/var/lib/stockflow/documents

  outbox-worker:
    image: ${STOCKFLOW_APP_IMAGE:-stockflow-app:local}
    pull_policy: never
    env_file: ${STOCKFLOW_ENV_FILE:-.env}
    entrypoint: ["/opt/stockflow/outbox-worker.sh"]
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:?POSTGRES_DB must be set in .env}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:?POSTGRES_USER must be set in .env}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      STOCKFLOW_WORKER_ENABLED: "true"
      SPRING_MAIN_WEB_APPLICATION_TYPE: none
      STOCKFLOW_SMTP_HOST: smtp
      STOCKFLOW_SMTP_PORT: "1025"
      STOCKFLOW_SMTP_FROM: stockflow@example.test
    depends_on:
      app:
        condition: service_started
      db:
        condition: service_healthy
      smtp:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
  documents-data:
